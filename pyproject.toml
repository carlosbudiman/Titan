[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dewaguard-titan"
version = "0.6.0"
description = "Dewaguard Titan — lightweight, graph-driven autonomous pentest harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
titan = "titan.cli:main"

[tool.setuptools]
packages = ["titan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
